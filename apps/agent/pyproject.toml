[project]
name = "liara-companion-agent"
version = "0.1.0"
description = "BFF and LangGraph orchestrator for همراه لیارا"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "cryptography>=43",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.0",
  "pathspec>=0.12",
  "psycopg[binary]>=3.2",
  "pydantic>=2.0",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Keep sandbox fixtures (intentional red tests) out of the agent suite.
norecursedirs = ["fixtures", ".*", "build", "dist", "*.egg"]
